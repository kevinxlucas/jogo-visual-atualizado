<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Jogo Visual" />
  <title>Jogo Visual</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon.svg" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <nav id="appNav" aria-label="Navegação principal">
    <strong class="brand">Jogo Visual</strong>
    <button id="playBtn" type="button">Jogar</button>
    <button id="dashboardBtn" type="button">Dashboard</button>
    <button id="historyBtn" type="button">Histórico</button>
    <button id="openDbBtn" type="button">Abrir Base de Dados</button>
    <button id="exportDataBtn" type="button">Exportar Dados</button>
    <span id="syncBadge" aria-live="polite">Local</span>
  </nav>

  <main id="panels" aria-live="polite">
    <section id="resultsPanel" class="panel hidden"></section>
    <section id="dashboardPanel" class="panel hidden"></section>
    <section id="historyPanel" class="panel hidden"></section>
  </main>

  <div id="ratingModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="ratingTitle">
    <form id="ratingForm" class="modalCard">
      <h2 id="ratingTitle">Resultado da tentativa</h2>
      <p><strong>De 0 a 10, como avalias a tua performance visual nesta tentativa?</strong></p>
      <input id="ratingInput" name="rating" type="number" min="0" max="10" step="1" required inputmode="numeric" autocomplete="off" />
      <label for="notesInput">Observações (opcional)</label>
      <textarea id="notesInput" name="notes" rows="4" placeholder="Escreve observações sobre esta tentativa…"></textarea>
      <button type="submit">Guardar resultado</button>
      <p class="muted">O resultado só é finalizado depois desta autoavaliação obrigatória.</p>
    </form>
  </div>

  <div id="exportModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="exportTitle">
    <div class="modalCard">
      <h2 id="exportTitle">Exportar Dados</h2>
      <button id="exportCsvBtn" type="button">CSV</button>
      <button id="exportXlsBtn" type="button">Excel (.xls)</button>
      <button id="exportPdfBtn" type="button">PDF / Imprimir</button>
      <button id="closeExportBtn" type="button" class="secondary">Fechar</button>
    </div>
  </div>

  <script src="vendor/p5.min.js"></script>
  <script src="vendor/p5.sound.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
